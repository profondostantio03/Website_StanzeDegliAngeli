<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esplora le Stanze | Associazione Angeli</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header class="header" style="background-color: var(--primary-green);">
        <div class="header__container">
            <a href="index.html" class="header__logo">
                Le Stanze degli<span style="color: var(--bg-cream);"> Angeli</span>
            </a>
        </div>
    </header>

    <!-- spazio per compensare l'header fisso -->
    <div style="margin-top: 100px;"></div>

    <section class="gallery-section">
        <div class="container">
            <h1 class="section-title">Esplora il Bosco</h1>
            <p class="section-subtitle">Passeggia tra i nostri spazi pensati per il benessere dell'anima.</p>
            
            <div class="gallery-grid">
                <div class="gallery-card">
                    <img src="assets/images/PratoIngresso1.jpeg" alt="L'altalena all'ingresso">
                    <div class="gallery-card__text">L'Altalena del Cuore</div>
                </div>
                <div class="gallery-card">
                    <img src="assets/images/StanzaArcobaleno1.jpeg" alt="Tavolo e vasetti colorati">
                    <div class="gallery-card__text">La Stanza Arcobaleno</div>
                </div>
                <div class="gallery-card">
                    <img src="assets/images/StanzaIngresso1.jpg" alt="Scalinata e ingresso">
                    <div class="gallery-card__text">Il Sentiero Principale</div>
                </div>
            </div>

            <div class="map-container">
                <h2 class="section-title" style="font-size: 2rem; margin-top: 60px;">Vieni a trovarci</h2>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3017.484652436133!2d14.556067400000003!3d40.861237100000004!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x133bb1145bcfceff%3A0x217c834cccf07625!2sLe%20Stanze%20degli%20Angeli!5e0!3m2!1sit!2sit!4v1788687726992!5m2!1sit!2sit" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer__container">
            
            <div class="footer__socials">
                <a href="https://www.facebook.com/stanzedegliangeli/" target="_blank" class="footer__icon" aria-label="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://www.instagram.com/associazioneangeli/" target="_blank" class="footer__icon" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://maps.app.goo.gl/nWSZZHzacZFkWAQr6" target="_blank" class="footer__icon" aria-label="Google Maps">
                    <i class="fas fa-map-marker-alt"></i>
                </a>
            </div>

            <div class="footer__copyright">
                &copy; profondostantio
            </div>
        </div>
    </footer>

</body>
</html>
