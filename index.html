<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Stanze degli Angeli | Associazione Angeli</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <header class="header">
        <div class="header__container">
            <a href="#" class="header__logo">
                Le Stanze degli<span style="color: var(--primary-green);"> Angeli</span>
            </a>
            </div>
    </header>

    <section id="home" class="hero">
        
        <div class="hero__slideshow">
            <img src="assets/images/PratoIngresso1.jpeg" alt="Altalena nel bosco" class="hero__slide active">
            <img src="assets/images/StanzaArcobaleno1.jpeg" alt="Vasetti colorati appesi" class="hero__slide">
            <img src="assets/images/StanzaIngresso1.jpg" alt="Scala di ferro nel bosco" class="hero__slide">
        </div>
        
        <div class="hero__overlay"></div> 
        
        <div class="hero__content">
            <h1 class="hero__title">
                Le Stanze <br>
                degli <span class="text-primary">Angeli</span>
            </h1>
            <p class="hero__subtitle">
                Il rifugio naturale dell'Associazione Angeli. <br>
                Un luogo dove il bosco sussurra storie e l'anima trova pace.
            </p>
            <a href="stanze.html" class="btn btn--primary">Scopri le stanze</a>
        </div>
    </section>

    <footer class="footer">
        <div class="footer__container">
            
            <div class="footer__socials">
                <a href="https://www.facebook.com/stanzedegliangeli/" target="_blank" class="footer__icon" aria-label="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://www.instagram.com/associazioneangeli/" target="_blank" class="footer__icon" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://maps.app.goo.gl/nWSZZHzacZFkWAQr6" target="_blank" class="footer__icon" aria-label="Google Maps">
                    <i class="fas fa-map-marker-alt"></i>
                </a>
            </div>

            <div class="footer__copyright">
                &copy; profondostantio
            </div>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
